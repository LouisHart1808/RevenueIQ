[project]
name = "revenueiq"
version = "0.1.0"
description = "E-commerce revenue and customer intelligence"
requires-python = ">=3.11,<3.14"
dependencies = ["dash>=3,<4", "plotly>=6,<7", "pandas>=2.2,<3", "numpy>=2,<3", "sqlalchemy>=2,<3", "psycopg2-binary>=2.9,<3", "dbt-postgres>=1.9,<2", "scipy>=1.14,<2", "statsmodels>=0.14,<1", "requests>=2.32,<3", "gunicorn>=23,<24", "pytest>=8,<9", "ruff>=0.11", "playwright>=1.50"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
